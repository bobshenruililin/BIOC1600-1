.1525684335877" y="298" font-size="14" font-family="sans-serif" font-weight="bold" text-anchor="middle">81-fold ruler is supporting biochemistry — not a device span</text><rect x="770" y="130" width="120" height="120" fill="#d3d3d3" stroke="#111" stroke-width="3" /><text x="830" y="175" font-size="14" font-family="sans-serif" font-weight="bold" text-anchor="middle">UNKNOWN</text><text x="830" y="198" font-size="12" font-family="sans-serif" text-anchor="middle">PaC probe θ</text><text x="830" y="216" font-size="12" font-family="sans-serif" text-anchor="middle">in Ames/tissue</text><text x="830" y="234" font-size="11" font-family="sans-serif" text-anchor="middle">unmeasured</text><text x="20" y="430" font-size="13" font-family="sans-serif">Hu 1.8 nM Langmuir–Freundlich apparent Kd is an AuED-MEA PBS number. It is not drawn here as tissue occupancy or as the retinal probe’s molecular Kd.</text><text x="20" y="450" font-size="13" font-family="sans-serif">PROPOSED: paired solution/surface isotherm of the Fc-thiol 39-mer; report n. Different hippocampal contexts are not a retinal spec.</text><text x="20" y="480" font-size="12" font-family="sans-serif" fill="#444">Axis: log10 [Glu] from 10 pM to 10 mM. 81-fold ruler shown at a generic 1 µM Kd so it cannot be mistaken for the 1.8 nM overlay.</text></svg>