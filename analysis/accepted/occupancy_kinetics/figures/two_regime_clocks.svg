erif">Authors: basal, not synaptic transients</text><text x="36" y="262" font-size="13" font-family="sans-serif">Light-on/off ACV (C033/E046); Ames 41.6% blank noise</text><text x="36" y="288" font-size="13" font-family="sans-serif">GCL bottom electrode (C034); pool vs photoreceptors UNKNOWN</text><text x="476" y="158" font-size="13" font-family="sans-serif">Clements 1.2 ms: cultured hippocampal INFERENCE</text><text x="476" y="184" font-size="13" font-family="sans-serif">Different preparation from Herman slices</text><text x="476" y="210" font-size="13" font-family="sans-serif">Glutamate aptamer koff: UNKNOWN</text><text x="476" y="236" font-size="13" font-family="sans-serif">Missing koff does not prove slow kinetics</text><text x="476" y="262" font-size="13" font-family="sans-serif">τ_eq at millimolar c: untested (MODELED if assumed)</text><text x="476" y="288" font-size="13" font-family="sans-serif">Not a failed hippocampal-cleft sensor</text><rect x="20" y="350" width="860" height="50" fill="#ffd166" stroke="#111" stroke-width="2" /><text x="450" y="380" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">PROPOSED: IPA/SPR kon/koff on the 39-mer — does not exist in this ledger</text></svg>