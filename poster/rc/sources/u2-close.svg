<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 368" width="900" height="368" role="img" aria-label="B4 U2 close: Name both currents (U2), proposed, not a result. Empty dashed six-cell protocol cartoon. Communication only. Does not replace the hybrid hero.">
  <!-- B4 close for hybrid v3. Does not replace hybrid-hero-v3.svg. Not a result. No PR. Mission 2 not reopened.
       No occupancy theta, no 1.8 nM, no clocks, no green MEASURED glutamate, no invented Kd / %gain / p. -->
  <defs>
    <pattern id="empty-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#ffffff"/>
      <path d="M0,8 L8,0" stroke="#cfcfcf" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="368" fill="#ffffff"/>
  <rect x="4" y="4" width="892" height="360" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- Title: exact B4 title -->
  <g font-family="sans-serif">
    <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold">Name both currents (U2) &#8212; proposed, not a result.</text>
  </g>

  <!-- Governing stamp is PROPOSED. No MEASURED-green on this card. -->
  <g font-family="sans-serif">
    <rect x="178" y="38" width="248" height="36" fill="#ffd166" stroke="#111" stroke-width="2.5"/>
    <text x="302" y="54" text-anchor="middle" font-size="15" font-weight="bold">PROPOSED</text>
    <text x="302" y="68" text-anchor="middle" font-size="10">not a result</text>
    <rect x="438" y="38" width="200" height="36" fill="#d3d3d3" stroke="#111" stroke-width="2"/>
    <text x="538" y="54" text-anchor="middle" font-size="13" font-weight="bold">UNKNOWN</text>
    <text x="538" y="68" text-anchor="middle" font-size="10">until U2 is run</text>
    <rect x="650" y="38" width="148" height="36" fill="#ffffff" stroke="#111" stroke-width="2"/>
    <text x="724" y="54" text-anchor="middle" font-size="13" font-weight="bold">Gate REVISE</text>
    <text x="724" y="68" text-anchor="middle" font-size="9">U2 locked</text>
  </g>

  <!-- Protocol header (no clocks) -->
  <g font-family="sans-serif">
    <text x="450" y="92" text-anchor="middle" font-size="11">same shank &#183; same room-light protocol &#183; include Leg A&#8217;s post-insertion baseline &#183; both ACV legs</text>
  </g>

  <!-- Column headers: working 39-mer | scrambled/binding-null | pharmacology -->
  <g font-family="sans-serif">
    <text x="252" y="114" text-anchor="middle" font-size="12" font-weight="bold">working 39-mer</text>
    <text x="508" y="114" text-anchor="middle" font-size="12" font-weight="bold">scrambled / binding-null</text>
    <text x="764" y="114" text-anchor="middle" font-size="12" font-weight="bold">pharmacology</text>
  </g>

  <!-- Row labels -->
  <g font-family="sans-serif">
    <text x="72" y="148" text-anchor="middle" font-size="12" font-weight="bold">Leg A</text>
    <text x="72" y="164" text-anchor="middle" font-size="10">IV = time</text>
    <text x="72" y="178" text-anchor="middle" font-size="9">light held ON</text>
    <text x="72" y="192" text-anchor="middle" font-size="9">baseline included</text>
    <text x="72" y="222" text-anchor="middle" font-size="12" font-weight="bold">Leg B</text>
    <text x="72" y="238" text-anchor="middle" font-size="10">IV = illumination</text>
    <text x="72" y="252" text-anchor="middle" font-size="9">ON | OFF | ON</text>
    <text x="72" y="266" text-anchor="middle" font-size="9">later</text>
  </g>

  <!-- Six empty dashed cells. Hatch = result not in hand. No bars, no numbers, no green Glu. -->
  <g>
    <rect x="132" y="122" width="240" height="70" fill="url(#empty-hatch)" stroke="#111" stroke-width="2" stroke-dasharray="7 4"/>
    <rect x="388" y="122" width="240" height="70" fill="url(#empty-hatch)" stroke="#111" stroke-width="2" stroke-dasharray="7 4"/>
    <rect x="644" y="122" width="240" height="70" fill="url(#empty-hatch)" stroke="#111" stroke-width="2" stroke-dasharray="7 4"/>
    <rect x="132" y="200" width="240" height="70" fill="url(#empty-hatch)" stroke="#111" stroke-width="2" stroke-dasharray="7 4"/>
    <rect x="388" y="200" width="240" height="70" fill="url(#empty-hatch)" stroke="#111" stroke-width="2" stroke-dasharray="7 4"/>
    <rect x="644" y="200" width="240" height="70" fill="url(#empty-hatch)" stroke="#111" stroke-width="2" stroke-dasharray="7 4"/>
  </g>

  <!-- Gold PROPOSED watermark across the grid so the 2x3 cannot be read as data -->
  <text x="508" y="204" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#ffd166" fill-opacity="0.38">PROPOSED</text>

  <g font-family="sans-serif" fill="#333">
    <text x="252" y="152" text-anchor="middle" font-size="11" font-weight="bold">empty</text>
    <text x="252" y="168" text-anchor="middle" font-size="10">result not in hand</text>
    <text x="252" y="182" text-anchor="middle" font-size="9">read current</text>
    <text x="508" y="152" text-anchor="middle" font-size="11" font-weight="bold">empty</text>
    <text x="508" y="168" text-anchor="middle" font-size="10">result not in hand</text>
    <text x="508" y="182" text-anchor="middle" font-size="9">read current</text>
    <text x="764" y="152" text-anchor="middle" font-size="11" font-weight="bold">empty</text>
    <text x="764" y="168" text-anchor="middle" font-size="10">result not in hand</text>
    <text x="764" y="182" text-anchor="middle" font-size="9">read current</text>
    <text x="252" y="230" text-anchor="middle" font-size="11" font-weight="bold">empty</text>
    <text x="252" y="246" text-anchor="middle" font-size="10">result not in hand</text>
    <text x="252" y="260" text-anchor="middle" font-size="9">read current</text>
    <text x="508" y="230" text-anchor="middle" font-size="11" font-weight="bold">empty</text>
    <text x="508" y="246" text-anchor="middle" font-size="10">result not in hand</text>
    <text x="508" y="260" text-anchor="middle" font-size="9">read current</text>
    <text x="764" y="230" text-anchor="middle" font-size="11" font-weight="bold">empty</text>
    <text x="764" y="246" text-anchor="middle" font-size="10">result not in hand</text>
    <text x="764" y="260" text-anchor="middle" font-size="9">read current</text>
  </g>

  <!-- Exact substitute line, red-X captions -->
  <rect x="16" y="278" width="868" height="22" fill="#ffffff" stroke="#c1121f" stroke-width="1.5"/>
  <g font-family="sans-serif">
    <text x="28" y="294" font-size="14" font-weight="bold" fill="#c1121f">&#215;</text>
    <text x="450" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#c1121f">U1 isotherm &#8800; identity &#183; C007 rates &#8800; identity &#183; late-only rebin names no analyte.</text>
  </g>

  <!-- Exact falsifier (two lines so the sentence is not clipped) -->
  <rect x="16" y="304" width="868" height="38" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <g font-family="sans-serif">
    <text x="450" y="320" text-anchor="middle" font-size="11">If currents survive pharmacology + binding-null on both legs, the glutamate-occupancy reading is falsified.</text>
    <text x="450" y="336" text-anchor="middle" font-size="11">If they die on both legs, the inference is strengthened &#8212; still not an inverted tissue [Glu].</text>
  </g>

  <!-- Close rules -->
  <g font-family="sans-serif">
    <text x="450" y="358" text-anchor="middle" font-size="11" font-weight="bold">U2 closes, never opens. U1 is a different question. Course cannot pipette U2. Gate stays REVISE.</text>
  </g>
</svg>
