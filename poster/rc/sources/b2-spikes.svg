<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="B2 card 2S: Same-shank firing does not name the current. Same-shank spikes are physiology on the shank, not a chemical ID of the faradaic current. Large ACV disk versus small ephys sites. Pool unknown. Not Leg A, not Leg B. Not the hero. No direction claimed. Ephys does not disconfirm glutamate.">
  <!-- B2 demotion card 2S. Communication only. Does not replace the hybrid hero. Not on B1.
       Mission 2 not reopened. No PR. No Astra. No invented numbers. No Hz. No dark/light
       direction. No ON-pathway label. No spike-rate panel. No Thesis E (ephys does not
       disconfirm glutamate). White ACV disk. Governing stamp UNKNOWN for ID.
       Traced spine: C034/E045 placement; C033 same-probe ACV current unnamed. -->
  <rect width="900" height="436" fill="#ffffff"/>
  <rect x="4" y="4" width="892" height="428" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- Card tab: NOT LEG A · NOT LEG B -->
  <rect x="16" y="12" width="292" height="34" fill="#ffffff" stroke="#c1121f" stroke-width="2.5"/>
  <text x="162" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c1121f">NOT LEG A &#183; NOT LEG B</text>

  <rect x="620" y="12" width="264" height="34" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="752" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">B2 &#183; 2S &#183; not the hero</text>
  <text x="752" y="40" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">demotion card &#183; schematic</text>

  <!-- Title: exact 2S title -->
  <text x="450" y="70" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold">Same-shank firing does not name the current</text>

  <!-- Claim (one breath; fidfix §3). No direction in the claim. -->
  <g font-family="sans-serif">
    <text x="450" y="92" text-anchor="middle" font-size="12">Same-shank spikes are physiology on the shank, not a chemical ID of the faradaic current.</text>
    <text x="450" y="110" text-anchor="middle" font-size="12">Large ACV disk vs small ephys sites; pool UNKNOWN. No direction claimed.</text>
  </g>

  <!-- Column labels -->
  <g font-family="sans-serif">
    <text x="156" y="134" text-anchor="middle" font-size="11" font-weight="bold">same shank (schematic)</text>
    <text x="450" y="134" text-anchor="middle" font-size="11" font-weight="bold">physiology on the shank</text>
    <text x="746" y="134" text-anchor="middle" font-size="11" font-weight="bold">faradaic current</text>
  </g>

  <!-- Shank cartoon: large white ACV disk vs small ephys sites. Neutral disk. No green. -->
  <rect x="16" y="142" width="280" height="208" fill="#fff8e7" stroke="#111" stroke-width="2.5"/>
  <g font-family="sans-serif">
    <text x="156" y="162" text-anchor="middle" font-size="11" font-weight="bold">PaC shank &#183; in vitro</text>
    <!-- shank body -->
    <rect x="146" y="172" width="20" height="118" fill="#eeeeee" stroke="#111" stroke-width="2"/>
    <!-- small ephys sites (equal, no rate encoding) -->
    <circle cx="156" cy="186" r="5" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <circle cx="156" cy="204" r="5" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <circle cx="156" cy="222" r="5" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <circle cx="156" cy="240" r="5" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="176" y="210" font-size="10">ephys sites</text>
    <text x="176" y="224" font-size="9" fill="#333">small contacts</text>
    <!-- large ACV disk (white: not a named Glu electrode) -->
    <circle cx="156" cy="278" r="22" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
    <text x="176" y="274" font-size="10" font-weight="bold">ACV disk</text>
    <text x="176" y="288" font-size="9" fill="#333">large &#183; GCL</text>
    <text x="156" y="328" text-anchor="middle" font-size="11" font-weight="bold">Same shank &#8800; same measurand.</text>
    <text x="156" y="342" text-anchor="middle" font-size="9" fill="#333">no rasters &#183; no rate bars</text>
  </g>

  <!-- Ephys object card: physiology, not an ID. No Hz. -->
  <rect x="308" y="142" width="276" height="208" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
  <g font-family="sans-serif">
    <text x="446" y="166" text-anchor="middle" font-size="13" font-weight="bold">ephys sites</text>
    <text x="446" y="184" text-anchor="middle" font-size="10">spikes on this shank</text>
    <rect x="324" y="196" width="244" height="20" fill="#b7e4c7" stroke="#111"/>
    <text x="446" y="210" text-anchor="middle" font-size="10" font-weight="bold">MEASURED: placement</text>
    <text x="446" y="232" text-anchor="middle" font-size="11">physiology on the shank</text>
    <text x="446" y="250" text-anchor="middle" font-size="10">sites exist &#183; not a Glu assay</text>
    <rect x="324" y="262" width="244" height="44" fill="#d3d3d3" stroke="#111" stroke-width="2"/>
    <text x="446" y="280" text-anchor="middle" font-size="13" font-weight="bold">does not name</text>
    <text x="446" y="296" text-anchor="middle" font-size="11">the faradaic current</text>
    <text x="446" y="326" text-anchor="middle" font-size="10">no spike-rate panel</text>
    <text x="446" y="340" text-anchor="middle" font-size="10">no Hz &#183; no ON-pathway label</text>
  </g>

  <!-- Connector: "does not name" is the teaching, not a disconfirm glyph. -->
  <g font-family="sans-serif">
    <text x="598" y="248" text-anchor="middle" font-size="18" font-weight="bold">&#8800;</text>
    <text x="598" y="264" text-anchor="middle" font-size="8">does</text>
    <text x="598" y="276" text-anchor="middle" font-size="8">not name</text>
  </g>

  <!-- Current object card: unnamed molecule + UNKNOWN pool. White well. -->
  <rect x="608" y="142" width="276" height="208" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
  <g font-family="sans-serif">
    <text x="746" y="166" text-anchor="middle" font-size="13" font-weight="bold">ACV disk</text>
    <text x="746" y="184" text-anchor="middle" font-size="10">large bottom electrode &#183; GCL</text>
    <rect x="624" y="196" width="244" height="20" fill="#b7e4c7" stroke="#111"/>
    <text x="746" y="210" text-anchor="middle" font-size="10" font-weight="bold">MEASURED: placement</text>
    <text x="746" y="232" text-anchor="middle" font-size="11">faradaic current</text>
    <text x="746" y="250" text-anchor="middle" font-size="10">not a chemical ID</text>
    <rect x="624" y="262" width="244" height="52" fill="#d3d3d3" stroke="#111" stroke-width="2"/>
    <text x="746" y="282" text-anchor="middle" font-size="15" font-weight="bold">UNKNOWN</text>
    <text x="746" y="298" text-anchor="middle" font-size="11" font-weight="bold">which molecule &#8212; unnamed</text>
    <text x="746" y="326" text-anchor="middle" font-size="10" font-weight="bold">UNKNOWN: photoreceptor pool</text>
    <text x="746" y="340" text-anchor="middle" font-size="9" fill="#333">pool not resolved by same-shank ephys</text>
  </g>

  <!-- Refusal strip: direction dropped; Thesis E not a finding -->
  <rect x="16" y="360" width="868" height="36" fill="#ffffff" stroke="#c1121f" stroke-width="1.5"/>
  <text x="450" y="375" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c1121f">No dark-higher %gain. No light-rising rates. No Hz. No ON-pathway label.</text>
  <text x="450" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c1121f">Ephys does not disconfirm glutamate &#183; not Thesis E &#183; not &#8220;not glutamate.&#8221;</text>

  <!-- ID rail: fidfix §3 list only -->
  <g font-family="sans-serif">
    <text x="450" y="414" text-anchor="middle" font-size="12" font-weight="bold">IDs: C034 &#183; E045 &#183; C033</text>
    <text x="450" y="428" text-anchor="middle" font-size="10" fill="#333">no 14 s here (clocks live on 2C) &#183; Gate REVISE &#183; Flagship NONE &#183; not group-final</text>
  </g>
</svg>
