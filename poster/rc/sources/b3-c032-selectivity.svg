    <text x="126" y="236" text-anchor="middle" font-size="12" font-weight="bold">serotonin</text>
    <text x="126" y="254" text-anchor="middle" font-size="10">10 &#181;M &#183; run</text>
    <rect x="228" y="214" width="188" height="54" fill="#ffffff" stroke="#111"/>
    <text x="322" y="236" text-anchor="middle" font-size="12" font-weight="bold">dopamine</text>
    <text x="322" y="254" text-anchor="middle" font-size="10">10 &#181;M &#183; run</text>
