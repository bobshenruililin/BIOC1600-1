  <rect x="16" y="366" width="868" height="28" fill="#ffffff" stroke="#c1121f" stroke-width="1.5"/>
  <text x="450" y="385" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c1121f">Not tissue identity. Not a Kd. Ames not drawn as a demonstrated confounder.</text>

  <g font-family="sans-serif">
    <text x="450" y="412" text-anchor="middle" font-size="12" font-weight="bold">IDs: C032 &#183; S066 &#183; Fig. 6.8A</text>
    <text x="450" y="428" text-anchor="middle" font-size="10" fill="#333">Gate REVISE &#183; Flagship NONE &#183; not group-final &#183; supporting only &#183; not next experiment</text>
