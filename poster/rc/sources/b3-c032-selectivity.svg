<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Supporting B3 card, not the finding. Aptamer buffer selectivity C032 S066 Figure 6.8A. One hundred nanomolar glutamate versus ten micromolar serotonin, dopamine, tyrosine, and lactate were run in probe calibration. No ratio printed. C032 value empty. Aspartate and glutamine not in that panel, stamped UNKNOWN. GABA stamped UNKNOWN, empty. This is not tissue identity and not a Kd. Gate REVISE. Flagship NONE. Supporting only. Not next experiment.">
  <!-- B3 supporting C032 selectivity. Skeleton from prompt contract; locators from freeze C032 only.
       Communication only. Not the finding. Not the hero. Not recognition-first.
       No PaC Kd well. No 1.8 nM. No 12 µM. No occupancy. No U1. No Ames-as-confounder.
       Appendix II g/l unconverted — not drawn. No ratio. C032 value kept empty.
       Stamp vocabulary: MEASURED / UNKNOWN only. Do not invent MODELED.
       Mission 2 not reopened. No PR. Astra not invoked. Flagship NONE. -->
  <rect width="900" height="440" fill="#ffffff"/>
  <rect x="4" y="4" width="892" height="432" fill="none" stroke="#111111" stroke-width="3"/>

  <rect x="16" y="12" width="292" height="34" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
  <text x="162" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">SUPPORTING &#8212; not the finding</text>

  <rect x="620" y="12" width="264" height="34" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="752" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">B3 &#183; C032 &#183; not the hero</text>
  <text x="752" y="40" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">supporting card &#183; prototype</text>

  <text x="450" y="68" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold">Buffer interferents that were run &#8212; not tissue identity, not a Kd</text>
  <text x="450" y="88" text-anchor="middle" font-family="sans-serif" font-size="12">Aptamer challenge in buffer. Does not name the tissue current. Not a molecular Kd.</text>

  <rect x="16" y="104" width="428" height="252" fill="#fff8e7" stroke="#111" stroke-width="2.5"/>
  <g font-family="sans-serif">
