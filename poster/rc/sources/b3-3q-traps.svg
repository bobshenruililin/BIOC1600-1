    <rect x="172" y="74" width="154" height="28" rx="4" fill="#e9ecef"/>
    <text x="180" y="92" font-size="9" font-family="system-ui,sans-serif" fill="#1a1a1a">biological_concentration_range</text>
    <text x="14" y="122" font-size="11" font-weight="700" font-family="system-ui,sans-serif" fill="#1a1a1a">NOT retinal [Glu]</text>
    <text x="14" y="140" font-size="9" font-family="system-ui,sans-serif" fill="#495057">MEASURED on that object &#183; C012</text>
  </g>

  <!-- Card 4: 12 micromolar. SURVIVE face from b3-3q-12um-trap.md. Do not add a vacancy. -->
  <g transform="translate(1068,48)">
    <rect x="3" y="3" width="334" height="150" rx="8" fill="#fffdf7" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="14" y="20" font-size="9" font-family="system-ui,sans-serif" fill="#6c757d" letter-spacing=".06em">3Q TRAP &#183; SUPPORTING</text>
    <text x="14" y="44" font-size="14" font-weight="700" font-family="system-ui,sans-serif" fill="#1a1a1a">12 &#181;M &#8212; wrong oligo / citation</text>
    <text x="14" y="62" font-size="11" font-family="system-ui,sans-serif" fill="#1a1a1a">not a remeasurement</text>
    <rect x="14" y="74" width="150" height="28" rx="4" fill="#e9ecef"/>
    <text x="22" y="92" font-size="9" font-family="system-ui,sans-serif" fill="#1a1a1a">1d04 isolate &#183; Kd_molecular &#183; abstract</text>
    <rect x="172" y="74" width="154" height="28" rx="4" fill="#e9ecef"/>
    <text x="180" y="92" font-size="9" font-family="system-ui,sans-serif" fill="#1a1a1a">Hu methods = Wu citation</text>
    <text x="14" y="122" font-size="11" font-weight="700" font-family="system-ui,sans-serif" fill="#1a1a1a">NOT this Fc-thiol 39-mer</text>
    <text x="14" y="140" font-size="9" font-family="system-ui,sans-serif" fill="#495057">MEASURED on those objects &#183; C001 &#183; C021</text>
  </g>
