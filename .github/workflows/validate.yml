name: validate
on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  ledgers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structure, ledgers, PDFs, tests
        run: |
          python3 scripts/check_structure.py
          python3 scripts/validate_ledgers.py
          python3 scripts/forbid_pdfs.py
          python3 -m unittest discover -s tests -v
      - name: Poster RC rebuild pixel checksum
        if: hashFiles('poster/rc/poster_rc.svg') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-core fonts-dejavu-core fonts-liberation
          fc-match sans-serif
          bash scripts/ci_rebuild_poster_rc.sh
