<svg xmlns="http://www.w3.org/2000/svg" width="980" height="860" viewBox="0 0 980 860"><title>Interrogation and sampling clocks versus a 1.2 ms inferred literature waveform (computational illustration; candidate, not flagship)</title><desc>Three layers: MEASURED Hu ACV clocks, INFERRED Clements tau, MODELED T over tau ratios. Waveform identity is lost on a 14 s interrogation axis. Not koff. Not a concentration at the electrode.</desc><rect x="0.00" y="0.00" width="980.00" height="860.00" fill="#fff" stroke="none" stroke-width="1" opacity="1" /><text x="20.00" y="24.00" font-size="16" font-family="sans-serif" fill="#222222" font-weight="bold" text-anchor="start">Can this ACV cadence report the shape of a 1.2 ms literature waveform?</text><text x="20.00" y="44.00" font-size="11" font-family="sans-serif" fill="#555555" font-weight="normal" text-anchor="start">Mission 2 candidate — interrogation/sampling-timescale mismatch. COMPUTATIONAL ILLUSTRATION. Not flagship. Not glutamate koff. C007 empty.</text><rect x="16.00" y="56.00" width="948.00" height="168.00" fill="#f4f4f4" stroke="#ccc" stroke-width="1" opacity="1" /><text x="28.00" y="78.00" font-size="13" font-family="sans-serif" fill="#222222" font-weight="bold" text-anchor="start">Layer 1  MEASURED  — Hu PaC retina ACV clocks (S066 §6.3)</text><rect x="28.00" y="90.00" width="450.00" height="86.00" fill="#fff" stroke="#c45c26" stroke-width="2" opacity="1" /><rect x="28.00" y="90.00" width="8.00" height="86.00" fill="#c45c26" stroke="none" stroke-width="1" opacity="1" /><text x="46.00" y="112.00" font-size="11" font-family="sans-serif" fill="#c45c26" font-weight="bold" text-anchor="start">interrogation</text><text x="46.00" y="136.00" font-size="14" font-family="sans-serif" fill="#222222" font-weight="bold" text-anchor="start">14 s / scan   E045 / C034</text><text x="46.00" y="160.00" font-size="11" font-family="sans-serif" fill="#555555" font-weight="normal" text-anchor="start">one ACV sweep → one scalar</text><rect