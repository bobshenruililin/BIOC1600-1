" stroke="#0d5c4d" stroke-width="2" opacity="1" /><rect x="530.00" y="270.00" width="8.00" height="168.00" fill="#0d5c4d" stroke="none" stroke-width="1" opacity="1" /><text x="552.00" y="292.00" font-size="11" font-family="sans-serif" fill="#0d5c4d" font-weight="bold" text-anchor="start">biological τ</text><text x="552.00" y="316.00" font-size="14" font-family="sans-serif" fill="#222222" font-weight="bold" text-anchor="start">1.2 ms   E033 / C011</text><text x="552.00" y="338.00" font-size="11" font-family="sans-serif" fill="#555555" font-weight="normal" text-anchor="start">quantity type: inferred free-Glu lifetime</text><text x="552.00" y="360.00" font-size="11" font-family="sans-serif" fill="#555555" font-weight="normal" text-anchor="start">not a sensor t90; stored as response_time in ledger</text><text x="552.00" y="382.00" font-size="11" font-family="sans-serif" fill="#555555" font-weight="normal" text-anchor="start">transferable to retina GCL electrode: UNKNOWN</text><text x="552.00" y="404.00" font-size="11" font-family="sans-serif" fill="#555555" font-weight="normal" text-anchor="start">kinetic inference, not a chemical assay</text><text x="552.00" y="424.00" font-size="10" font-family="sans-serif" fill="#555555" font-weight="normal" text-anchor="start">If this τ is the named spec, Layer 3 follows. If it is not, Layer 3 does not grade Hu’s experiment.</text><rect x="16.00" y="492.00" width="948.00" height="328.00" fill="#fff" stroke="#ccc" stroke-width="1" opacity="1" /><text x="28.00" y="514.00" font-size="13" font-family="sans-serif" fill="#222222" font-weight="bold" text-anchor="start">Layer 3  MODELED  — T/τ clock ratios under hypothetical instantaneous occupancy</text><rect x="70.00" y="528.00" width="880.00" height="70.00" fill="#fafafa" stroke="#000" stroke-width="1" opacity="1" /><line x1="195.71" y1="598.00" x2="195.71" y2="604.00" stroke="#333" stroke-width="1" /><text x="195.71" y="618.00" font-size="10" font-family="sans-serif" fill="#222222" font-weight="normal" text-anchor="middle">1 ms</text><line x1="205.67" y1="598.00" x2="205.67" y2="604.00" stroke="#333" stroke-width="1" /><text x="205.67" y="618.00" font-size="10" font-family="sans-serif" fill="#222222" font-weight="normal" text-anchor="middle">1.2 ms</text><line x1="572.86" y1="598.00" x2="572.86" y2="604.00" stroke="#333" stroke-width="1" /><text x="572.86" y="618.00" font-size="10" font-family="sans-serif" fill="#222222" font-weight="normal" text-anchor="middle">1 s</text><line x1="716.94" y1="598.00" x2="716.94" y2="604.00" stroke="#333" stroke-width="1" /><text x="716.94" y="618.00" font-size="10" font-family="sans-serif" fill="#222222" font-weight="normal" text-anchor="middle">14 s</text><line x1="796.40" y1="598.00" x2="796.40" y2="604.00" stroke="#333" stroke-width="1" /><text x="796.40" y="618.00" font-size="10" font-family="sans-serif" fill="#222222" font-weight="normal" text-anchor="middle">60 s</text><line x1="950.00" y1="598.00" x2="950.00" y2="604.00" stroke="#333" stroke-width="1" /><text x="950.00" y="618.00" font-size="10" font-family="sans-serif" fill="#222222" font-weight="normal" text-anchor="middle">10³ s</text><text x="510.00" y="634.00" font-size="11" font-family="sans-serif" fill="#222222" font-weight="normal" text-anchor="middle">log10 time (s) — clocks, not a shared kinetic axis</text><line x1="205.67" y1="536.00" x2="205.67" y2="590.00" stroke="#0d5c4d" stroke-width="3" /><line x1="716.94" y1="536.00" x2="716.94" y2="590.00" stroke="#c45c26" stroke-width="3" /><line x1="796.40" y1="536.00" x2="796.40" y2="590.00" stroke="#5b4b8a" stroke-width="3" /><text x="209.67" y="550.00" font-size="10" font-family="sans-serif" fill="#0d5c4d" font-weight="normal" text-anchor="start">INFERRED τ</text><text x="712.94" y="550.00" font-size="10" font-family="sans-serif" fill="#c45c26" font-weight="normal" text-anchor="end">MEASURED scan</text><text x="800.40" y="566.00" font-size="10" font-family="sans-serif" fill="#5b4b8a" font-weight="normal" text-anchor="start">MEASURED sampling</text><text x="28.00" y="650.00" font-size="13" font-family="sans-serif" fill="#222222" font-weight="bold" text-anchor="start">14 s / 1.2 ms = 11,667 × τ     60 s / 1.2 ms = 50,000 × τ     each clock independently T ≫ τ</text><rect x="70.00" y="668.00" width="720.00" height="90.00" fill="#fafafa" stroke="#000" stroke-width="1" opacity="1" /><rect x="70.00" y="668.00" width="720.00" height="90.00" fill="#c45c26" stroke="none" stroke-width="1" opacity="0.12" /><text x="80.00" y="684.00" font-size="10" font-family="sans-serif" fill="#c45c26" font-weight="normal" text-anchor="start">one 14 s interrogation window (E045) → one scalar; shape is not a degree of freedom</text><line x1="71.00" y1="758.00" x2="71.00" y2="676.00" stroke="#0d5c4d" stroke-width="2" /><text x="78.00" y="704.00" font-size="10" font-family="sans-serif" fill="#0d5c4d" font-weight="normal" text-anchor="start">inferred 1.2 ms waveform — narrower than one pixel on this 14 s axis</text><text x="78.00" y="720.00" font-size="10" font-family="sans-serif" fill="#555555" font-weight="normal" text-anchor="start">Not [Glu] at the GCL-positioned PaC electrode. Spatial dilution unmeasured. No mean nM is plotted.</text><line x1="70.00" y1="758.00" x2="70.00" y2="763.00" stroke="#333" stroke-width="1" /><text x="70.00" y="776.00" font-size="10" font-family="sans-serif" fill="#222222" font-weight="normal" text-anchor="middle">0</text><line x1="430.00" y1="758.00" x2="430.00" y2="763.00" stroke="#333" stroke-width="1" /><text x="430.00" y="776.00" font-size="10" font-family="sans-serif" fill="#222222" font-weight="normal" text-anchor="middle">7</text><line x1="790.00" y1="758.00" x2="790.00" y2="763.00" stroke="#333" stroke-width="1" /><text x="790.00" y="776.00" font-size="10" font-family="sans-serif" fill="#222222" font-weight="normal" text-anchor="middle">14</text><text x="430.00" y="790.00" font-size="11" font-family="sans-serif" fill="#222222" font-weight="normal" text-